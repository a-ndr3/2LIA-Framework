name: "lss_thesis_ui"
description: "LSS Event Analysis UI"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.8.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/grafana1.svg
    - assets/icons/prometheus.svg
    - assets/icons/swagger.svg
